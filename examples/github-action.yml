name: Agent Contract Gate

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  agent-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ./
        with:
          url: "https://example.com"
          mode: "report"
          report: "agent-contract-report.html"
          markdown-report: "agent-contract-report.md"
          pr-comment: "true"
          mcp: "mcp.json"

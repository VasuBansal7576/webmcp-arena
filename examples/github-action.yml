name: Arena WebMCP Preflight

on:
  workflow_dispatch:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: VasuBansal7576/webmcp-arena@v0.3.0
        with:
          url: https://example.com
          report: arena-webmcp-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-webmcp-preflight
          path: arena-webmcp-preflight.json

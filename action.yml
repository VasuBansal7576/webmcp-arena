name: "Arena WebMCP Preflight"
description: "Run Arena's bounded static WebMCP preflight before a measured boundary audit."
inputs:
  url:
    description: "Public HTTP(S) page to inspect."
    required: true
  mcp:
    description: "Optional MCP manifest URL or path."
    required: false
    default: ""
  openapi:
    description: "Optional OpenAPI JSON URL or path."
    required: false
    default: ""
  report:
    description: "JSON report path."
    required: false
    default: "arena-webmcp-preflight.json"
runs:
  using: "composite"
  steps:
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install Arena runtime
      shell: bash
      run: npm ci --ignore-scripts --omit=dev --prefix "$GITHUB_ACTION_PATH"
    - name: Run Arena preflight
      shell: bash
      env:
        ARENA_INPUT_URL: ${{ inputs.url }}
        ARENA_INPUT_MCP: ${{ inputs.mcp }}
        ARENA_INPUT_OPENAPI: ${{ inputs.openapi }}
        ARENA_INPUT_REPORT: ${{ inputs.report }}
      run: |
        set -euo pipefail
        args=("$ARENA_INPUT_URL" "--format" "json")
        if [ -n "$ARENA_INPUT_MCP" ]; then args+=("--mcp" "$ARENA_INPUT_MCP"); fi
        if [ -n "$ARENA_INPUT_OPENAPI" ]; then args+=("--openapi" "$ARENA_INPUT_OPENAPI"); fi
        node "$GITHUB_ACTION_PATH/bin/arena.js" preflight "${args[@]}" | tee "$ARENA_INPUT_REPORT"
